{% set name = "git-remote-codecommit" %}
{% set version = "1.18" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: a34b737b0bd4b52932fd12cc42b3dfed5a7e4d87b5bc24910b90bf6e0f42f580

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0
  entry_points:
    - git-remote-codecommit = git_remote_codecommit:main

requirements:
  host:
    - python >=3.6
    - pip
  run:
    - python >=3.6
    - botocore >=1.17.0

test:
  imports:
    - git_remote_codecommit
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/aws/git-remote-codecommit
  summary: A Git extension for pushing and pulling from AWS CodeCommit.
  description: |
    This package enables pushing and pulling from repository URLs prefixed with codecommit://
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  doc_url: https://github.com/aws/git-remote-codecommit
  dev_url: https://github.com/aws/git-remote-codecommit

extra:
  recipe-maintainers:
    - SylvainCorlay
